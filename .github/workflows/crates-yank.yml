# Yank one published version of a crate from crates.io, by hand.
#
# A yank stops new projects from depending on that version. It does not delete it, and
# `cargo yank --undo` restores it. Needs the repository secret CARGO_REGISTRY_TOKEN.
name: Yank crate version

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate name, for example falak-ledger"
        required: true
      version:
        description: "Version to yank, for example 1.1.0"
        required: true

permissions:
  contents: read

jobs:
  yank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the inputs
        env:
          CRATE: ${{ inputs.crate }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$CRATE" in falak-*) ;; *) echo "only falak-* crates can be yanked here" >&2; exit 1 ;; esac
          printf '%s' "$CRATE" | grep -Eq '^falak-[a-z0-9-]{1,50}$' || { echo "bad crate name" >&2; exit 1; }
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version" >&2; exit 1; }
      - name: Toolchain
        run: rustup show
      - name: Yank
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ inputs.crate }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "the secret CARGO_REGISTRY_TOKEN is not set" >&2; exit 1; }
          cargo yank --version "$VERSION" "$CRATE"
