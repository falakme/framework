# Publish the crates of a tag to crates.io, by hand.
#
# crates.io lets a new account publish a few new crates at once, then about one every
# ten minutes; new versions of existing crates are limited less. scripts/release/publish.py
# publishes in dependency order, skips every crate already published at this version, and
# on a rate limit (HTTP 429) waits until the time crates.io names. It stops for any other
# error. Safe to run again. Needs the repository secret CARGO_REGISTRY_TOKEN.
name: Publish crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.1.0"
        required: true
      dry_run:
        description: "Only print the plan and what is already on crates.io"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Toolchain
        run: rustup show
      - name: The tag matches the version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/release/publish.py --dry-run
          else
            test -n "$CARGO_REGISTRY_TOKEN" || { echo "the secret CARGO_REGISTRY_TOKEN is not set" >&2; exit 1; }
            python3 scripts/release/publish.py --max-wait-minutes 300
          fi
