# Publish the crates of a tag to crates.io, by hand.
#
# crates.io lets a new account publish a few new crates at once, then about one every
# ten minutes. This job keeps trying until every crate is up. Crates already published
# at this version are skipped. Needs the repository secret CARGO_REGISTRY_TOKEN.
name: Publish crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - name: Toolchain
        run: rustup show
      - name: Publish, retrying while crates.io rate-limits
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "the secret CARGO_REGISTRY_TOKEN is not set" >&2; exit 1; }
          for attempt in $(seq 1 30); do
            echo "attempt $attempt"
            if cargo publish --workspace --locked; then exit 0; fi
            sleep 660
          done
          echo "not every crate was published" >&2
          exit 1
