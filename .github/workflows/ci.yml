name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every published crate packages and builds from its own tarball, in dependency order.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Package (dry run)
        run: cargo publish --workspace --dry-run --locked
      - name: Publish script tests and plan (no network write, no token)
        run: |
          python3 scripts/release/test_publish.py
          python3 scripts/release/publish.py --dry-run

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (native)
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build portable crates (wasm32)
        run: cargo build --locked --target wasm32-unknown-unknown -p falak-contracts -p falak-core
      - name: Notebook smoke test
        run: bash scripts/smoke/notebook.sh
      - name: Isolation smoke test (SQLite)
        run: bash scripts/smoke/isolation.sh
      - name: Compute smoke test (worker killed mid-job)
        run: bash scripts/smoke/compute.sh
      - name: AI smoke test (injected instructions)
        run: bash scripts/smoke/ai.sh
      - name: Generated files are current
        run: |
          cargo run --locked -q -p falak-cli -- sync examples/notebook --out examples/notebook/web/src/falak.generated.ts
          git diff --exit-code -- examples/notebook
      - name: Build token verification (wasm32)
        run: cargo build --locked --target wasm32-unknown-unknown -p falak-auth --no-default-features
      - name: Build the edge runtime (wasm32)
        run: cargo build --locked --target wasm32-unknown-unknown -p falak-runtime-edge
      - name: Edge runtime WASM size budget
        run: bash scripts/check-wasm-size.sh

  # The same Notebook smoke test on PostgreSQL (T2.11).
  smoke-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d notebook"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Notebook smoke test on PostgreSQL
        env:
          FALAK_TARGET: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/notebook
        run: bash scripts/smoke/notebook.sh
      # Its own database: the notebook smoke test left its tables, and a migration of the
      # test's app would be asked to drop them.
      - name: Row-level security conformance
        env:
          FALAK_TEST_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/rls
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE rls'
          cargo test --locked -p falak-runtime-native --test rls_tests
      # Its own database: the test drops and recreates its tables.
      - name: Runtime REST on PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/runtime_rest
          FALAK_REQUIRE_PG: "1"
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE runtime_rest'
          cargo test --locked -p falak-runtime-native --test postgres_runtime_tests
      - name: Relationship rules on PostgreSQL
        env:
          FALAK_TEST_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE related_reads' -c 'CREATE DATABASE related_writes'
          cargo test --locked -p falak-runtime-native --test related_policy_tests
      - name: Isolation smoke test on PostgreSQL
        env:
          FALAK_TARGET: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/notebook
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE isolation'
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE live'
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/isolation bash scripts/smoke/isolation.sh
      - name: A schema change on a running app, no downtime
        run: DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/live bash scripts/smoke/migrate-live.sh

  # The ledger: PostgreSQL integration tests, then the double-spend smoke test (T8.2, T8.6).
  smoke-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ledger"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Ledger tests on PostgreSQL
        env:
          FALAK_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/ledger
        run: cargo test --locked -p falak-ledger --test postgres
      - name: Double-spend smoke test
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ledger
        run: bash scripts/smoke/ledger.sh

  # Office, Studio and three apps as real processes (T4.13): sign in once, revocation, key
  # rotation under load, what each tier does with Office stopped. Run on SQLite, then with
  # Office on PostgreSQL.
  smoke-office:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: office
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d office"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Browser tooling (test only)
        run: npm ci --ignore-scripts
        working-directory: scripts/ui
      - name: Office smoke test, SQLite, with Studio's page in Chrome
        env:
          FALAK_UI_DIR: ${{ runner.temp }}/ui-studio
        run: bash scripts/smoke/office.sh
      - name: Office console in Chrome (setup, every tab, a phone-sized screen)
        run: node scripts/ui/office-ui.mjs target/debug/falak-office "$RUNNER_TEMP/ui-office"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: |
            ${{ runner.temp }}/ui-studio
            ${{ runner.temp }}/ui-office
          if-no-files-found: ignore
      - name: Office smoke test, Office on PostgreSQL
        env:
          OFFICE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/office
        run: bash scripts/smoke/office.sh

  # Durable events (T5.7): place orders while Office and a consumer are killed, then check
  # that orders and inventory agree exactly. Run on SQLite, then with Office on PostgreSQL.
  smoke-events:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: office
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d office"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Events smoke test, SQLite
        run: bash scripts/smoke/events.sh
      - name: Events smoke test, Office on PostgreSQL
        env:
          OFFICE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/office
        run: bash scripts/smoke/events.sh

  # Phase 6: two Office instances and a failover, then the disaster-recovery drill
  # (it fails if the RPO of 5 minutes or the RTO of 1 hour is missed).
  smoke-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Office high availability and failover
        run: bash scripts/smoke/office-ha.sh
      - name: Disaster-recovery drill
        run: bash scripts/smoke/dr.sh

  # Backup and restore of a PostgreSQL database into an empty one (T3.7). The script runs
  # psql inside a container with a fixed name, so the database is started by hand.
  smoke-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start PostgreSQL
        run: |
          docker run -d --name falak-test-postgres -e POSTGRES_PASSWORD=postgres -p 127.0.0.1:54321:5432 postgres:16-alpine
          # The image starts a temporary socket-only server to initialise, then restarts: wait until a
          # query over TCP succeeds twice in a row, which only the final server can do.
          ok=0
          for _ in $(seq 1 60); do
            if docker exec falak-test-postgres psql -h 127.0.0.1 -U postgres -d postgres -Atc 'select 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
              [ "$ok" -ge 2 ] && break
            else
              ok=0
            fi
            sleep 1
          done
          [ "$ok" -ge 2 ] || { echo "PostgreSQL did not become ready" >&2; docker logs falak-test-postgres; exit 1; }
      - name: Backup and restore
        env:
          # The runner's pg_dump is newer than the server (16): use the matching client.
          FALAK_PG_DOCKER: "1"
        run: bash scripts/smoke/postgres-backup-restore.sh

  # Sign-in through a real OpenID Connect provider: Dex, an independent open-source server.
  smoke-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Office with Dex
        run: bash scripts/smoke/office-oidc.sh

  # The Office and Studio image builds, starts, and offers browser setup.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -f deploy/office/Dockerfile -t falak-office:ci .
      - name: Run it
        run: |
          docker run -d --name office -p 127.0.0.1:8788:8788 falak-office:ci
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:8788/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8788/readyz
          test "$(curl -fsS http://127.0.0.1:8788/v1/_office/status | python3 -c 'import sys,json; print(json.load(sys.stdin)["setup_needed"])')" = True
          docker logs office 2>&1 | grep -q '/?setup='
          curl -fsS http://127.0.0.1:8788/ | grep -q 'Falak Office'
          docker exec office id -u | grep -qv '^0$'
      - name: Logs
        if: failure()
        run: docker logs office

  # The same smoke test on Workers (T2.11). It deploys a throwaway Worker and database to
  # the Cloudflare account in the repository secrets, tests it, and deletes both. It runs
  # on pushes only: pull requests from forks have no secrets. Without the secrets it
  # says so in the run summary instead of passing quietly.
  smoke-workers:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: falak-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::smoke-workers did not run: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository secrets"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Toolchain
        if: steps.secrets.outputs.present == 'true'
        run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: 24
      - name: Deploy a throwaway Worker
        if: steps.secrets.outputs.present == 'true'
        id: deploy
        run: |
          cargo install worker-build --locked
          cargo build --locked -p falak-cli
          ./target/debug/falak deploy examples/notebook --name "$WORKER_NAME" | tee deploy.log
          echo "url=$(sed -n 's/^deployed: //p' deploy.log)" >> "$GITHUB_OUTPUT"
      - name: Notebook smoke test on Workers
        if: steps.secrets.outputs.present == 'true'
        env:
          FALAK_TARGET: workers
          FALAK_URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/smoke/notebook.sh
      - name: Deploy Falak.me to a second throwaway Worker
        if: steps.secrets.outputs.present == 'true'
        id: deploy_falakme
        run: |
          ./target/debug/falak deploy examples/falakme --name "$WORKER_NAME-iso" | tee deploy2.log
          echo "url=$(sed -n 's/^deployed: //p' deploy2.log)" >> "$GITHUB_OUTPUT"
      - name: Isolation smoke test on Workers
        if: steps.secrets.outputs.present == 'true'
        env:
          FALAK_TARGET: workers
          FALAK_URL: ${{ steps.deploy_falakme.outputs.url }}
        run: bash scripts/smoke/isolation.sh
      - name: Delete the throwaway Worker and database
        if: always() && steps.secrets.outputs.present == 'true'
        run: |
          npx --yes wrangler@4.156.2 delete --name "$WORKER_NAME" --force || true
          npx --yes wrangler@4.156.2 d1 delete "$WORKER_NAME-db" -y || true
          npx --yes wrangler@4.156.2 delete --name "$WORKER_NAME-iso" --force || true
          npx --yes wrangler@4.156.2 d1 delete "$WORKER_NAME-iso-db" -y || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.10.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
