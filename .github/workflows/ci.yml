name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (native)
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build portable crates (wasm32)
        run: cargo build --locked --target wasm32-unknown-unknown -p falak-contracts -p falak-core
      - name: Generated files are current
        run: |
          cargo run --locked -q -p falak-cli -- sync examples/notebook --out examples/notebook/web/src/falak.generated.ts
          git diff --exit-code -- examples/notebook
      - name: Build token verification (wasm32)
        run: cargo build --locked --target wasm32-unknown-unknown -p falak-auth --no-default-features

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.10.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
