# Release (T4.14): on a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`, which becomes a pre-release).
#
# Builds the three programs, writes a software bill of materials from Cargo.lock, writes
# checksums, signs everything with GitHub's build provenance attestations (Sigstore,
# keyless: no signing key is stored anywhere), and publishes a GitHub release.
#
# The tag must match the workspace version in Cargo.toml, so a mistyped tag stops here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: The tag matches the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Toolchain
        run: rustup show
      - name: Build
        run: cargo build --release --locked -p falak-cli -p falak-office -p falak-studio
      - name: Package
        shell: bash
        run: |
          name="falak-$GITHUB_REF_NAME-$(uname -s | tr A-Z a-z)-$(uname -m)"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C target/release falak falak-office falak-studio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  # The Office and Studio image, for pulling and for Coolify.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and push
        env:
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/falak-office"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/office/Dockerfile -t "$image:$GITHUB_REF_NAME" .
          docker push "$image:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) ;;  # a candidate does not move latest
            *) docker tag "$image:$GITHUB_REF_NAME" "$image:latest"; docker push "$image:latest" ;;
          esac

  # Crates.io, only for a final release. Needs the repository secret CARGO_REGISTRY_TOKEN
  # (a crates.io token with publish rights). Without it this job fails and the rest of the
  # release is unaffected; add the secret and re-run the job.
  crates:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain
        run: rustup show
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "the secret CARGO_REGISTRY_TOKEN is not set" >&2; exit 1; }
          # crates.io rate-limits new crates (a few at once, then one every ten minutes).
          for attempt in $(seq 1 30); do
            if cargo publish --workspace --locked; then exit 0; fi
            sleep 660
          done
          exit 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Software bill of materials and checksums
        run: |
          python3 scripts/release/sbom.py > "dist/falak-$GITHUB_REF_NAME.cdx.json"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Sign (build provenance attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"   # a candidate uses the notes of the release it leads to
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no section for $version in CHANGELOG.md" >&2; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Falak Framework $GITHUB_REF_NAME" --notes-file notes.md $flag
