[package]
name = "falak-federation"
description = "The app side of Falak Office: enroll, sign requests, follow the key set and revocation feed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Calls to Office over HTTP (blocking), for the native runtime and the CLI.
default = ["http"]
http = ["dep:ureq"]

[dependencies]
falak-auth = { path = "../falak-auth", version = "1.1.1", default-features = false }
falak-contracts.workspace = true
falak-core.workspace = true
falak-runtime-native = { path = "../falak-runtime-native", version = "1.1.1", default-features = false }
axum = { version = "0.8.9", default-features = false }
base64 = "0.23"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "3", features = ["json"], optional = true }
