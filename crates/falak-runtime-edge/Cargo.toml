[package]
name = "falak-runtime-edge"
description = "Cloudflare Workers runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything here exists only for the edge build. On other targets the crate is empty,
# so `cargo build --workspace` stays fast.
[target.'cfg(target_arch = "wasm32")'.dependencies]
falak-auth = { path = "../falak-auth" }
falak-contracts.workspace = true
falak-core.workspace = true
falak-driver-d1 = { path = "../falak-driver-d1" }
falak-federation = { path = "../falak-federation", default-features = false }
falak-migrate = { path = "../falak-migrate" }
falak-runtime-native = { path = "../falak-runtime-native", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["json", "query"] }
worker = { version = "0.9", default-features = false, features = ["http", "axum", "d1"] }
tower-service = "0.3"
http = "1"
serde_json.workspace = true
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
