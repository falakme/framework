[package]
name = "falak-driver-d1"
description = "Cloudflare D1 storage driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
falak-contracts.workspace = true
serde.workspace = true

# The Workers binding exists only when building for the edge. Native builds compile
# the driver logic against the `D1Binding` trait so it can be tested without Workers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.9", default-features = false, features = ["d1"] }

[dev-dependencies]
serde_json = "1"
