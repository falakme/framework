[package]
name = "falak-studio"
description = "Falak Studio: an admin interface generated from each app's `admin:` metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "falak-studio"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
base64 = "0.22"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
