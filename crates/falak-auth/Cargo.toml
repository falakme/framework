[package]
name = "falak-auth"
description = "Local identity: passwords, sessions, Ed25519 tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `native` adds everything that needs randomness or a database: key generation, password
# hashing, sessions. Without it only token verification is built, which compiles for
# `wasm32` (the edge runtime, T2.9).
default = ["native"]
native = ["dep:argon2", "dep:rand_core", "dep:sha2", "dep:p256", "ed25519-dalek/rand_core"]

[dependencies]
falak-contracts.workspace = true
argon2 = { version = "0.6", optional = true }
base64 = "0.22"
ed25519-dalek = "3"
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
serde_json.workspace = true
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"], optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# p256 0.14 reaches getrandom 0.4 (through crypto-bigint), which needs this feature on
# wasm32-unknown-unknown. The package is renamed because 0.2 above is the same name.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
falak-driver-sqlite = { path = "../falak-driver-sqlite", version = "1.1.1" }
tokio = { version = "1", features = ["rt", "macros"] }
