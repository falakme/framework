[package]
name = "falak-ai"
description = "MCP server: lets an AI agent use an app's REST API as the signed-in user."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
falak-contracts.workspace = true
falak-core.workspace = true
falak-runtime-native = { path = "../falak-runtime-native", version = "1.1.0" }
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
falak-runtime-native = { path = "../falak-runtime-native", version = "1.1.0", features = ["dev-auth"] }
falak-driver-sqlite = { path = "../falak-driver-sqlite", version = "1.1.0" }
falak-migrate = { path = "../falak-migrate", version = "1.1.0" }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
