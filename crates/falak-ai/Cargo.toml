[package]
name = "falak-ai"
description = "AI readiness: the MCP server projection, the AI egress policy and the human approval gate for writes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
falak-contracts.workspace = true
falak-core.workspace = true
falak-egress = { path = "../falak-egress", version = "1.0.0" }
falak-runtime-native = { path = "../falak-runtime-native", version = "1.0.0" }
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
sha2.workspace = true
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
falak-runtime-native = { path = "../falak-runtime-native", version = "1.0.0", features = ["dev-auth"] }
falak-driver-sqlite = { path = "../falak-driver-sqlite", version = "1.0.0" }
falak-migrate = { path = "../falak-migrate", version = "1.0.0" }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
