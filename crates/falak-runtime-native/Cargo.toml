[package]
name = "falak-runtime-native"
description = "Native runtime (Axum, Tokio) serving a compiled app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `server` is everything that needs an operating system: request tracing and the
# telemetry exporter. `sqlite` and `postgres` add those drivers. The edge runtime builds
# this crate for `wasm32` with `default-features = false`.
default = ["server", "sqlite", "postgres"]
server = ["dep:tower-http", "dep:tracing-subscriber", "dep:tokio", "axum/tokio", "axum/http1", "files"]
# Uploads and downloads against S3 or R2. Off for the edge build.
files = ["dep:falak-storage", "dep:tokio", "tokio/rt"]
sqlite = ["dep:falak-driver-sqlite", "dep:tokio", "tokio/sync"]
postgres = ["dep:falak-driver-postgres"]
# Compiles `DevAuthenticator`, which trusts the bearer value as the user id. For tests
# only: no binary enables it.
dev-auth = []

[dependencies]
falak-auth = { path = "../falak-auth" }
falak-contracts.workspace = true
falak-core.workspace = true
falak-driver-sqlite = { path = "../falak-driver-sqlite", optional = true }
falak-migrate = { path = "../falak-migrate" }
falak-storage = { path = "../falak-storage", optional = true }
falak-driver-postgres = { path = "../falak-driver-postgres", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["json", "query"] }
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
tower = "0.5"
tower-http = { version = "0.6", default-features = false, features = ["cors", "trace"], optional = true }
tracing = "0.1"
hex = "0.4"
sha2 = "0.10"
unicode-normalization = "0.1.26"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "ansi"], optional = true }

[dev-dependencies]
falak-runtime-native = { path = ".", features = ["dev-auth"] }
falak-driver-sqlite = { path = "../falak-driver-sqlite" }
falak-migrate = { path = "../falak-migrate" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
