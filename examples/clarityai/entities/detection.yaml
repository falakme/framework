schema_version: 1
entity: detection
owner: owner_id
fields:
  document_id: { type: uuid, required: true, indexed: true, references: document.id }
  kind: { type: text, required: true, max_length: 40 }
  token: { type: text, required: true, max_length: 80 }
  start: { type: int64, required: true }
  stop: { type: int64, required: true }
  owner_id: { type: uuid, required: true, indexed: true }
relations:
  document: { kind: belongs_to, entity: document, field: document_id }
admin:
  label: Detections
  list_columns: [kind, token]
  search_fields: [kind]
