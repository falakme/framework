schema_version: 1
entity: wallet
owner: owner_id
fields:
  label: { type: text, required: true, max_length: 100 }
  currency: { type: text, required: true, max_length: 3 }
  ledger_account: { type: text, required: true, unique: true, max_length: 128 }
  owner_id: { type: uuid, required: true, indexed: true }
admin:
  label: Wallets
  list_columns: [label, currency]
