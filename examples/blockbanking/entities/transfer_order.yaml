schema_version: 1
entity: transfer_order
owner: customer_id
fields:
  from_account_id: { type: uuid, required: true, indexed: true, references: customer_account.id }
  to_ledger_account: { type: text, required: true, max_length: 128 }
  amount: { type: decimal_minor, required: true, min: 1 }
  currency: { type: text, required: true, max_length: 3 }
  status: { type: text, required: true, max_length: 20, default: pending }
  tx_hash: { type: text, max_length: 64 }
  ledger_tx_id: { type: uuid }
  customer_id: { type: uuid, required: true, indexed: true }
relations:
  from_account: { kind: belongs_to, entity: customer_account, field: from_account_id }
admin:
  label: Transfer orders
  list_columns: [status, amount, currency]
