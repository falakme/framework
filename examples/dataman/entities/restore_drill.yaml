schema_version: 1
entity: restore_drill
owner: custodian_id
fields:
  dataset_id: { type: uuid, required: true, indexed: true, references: dataset.id }
  ran_at: { type: timestamptz, required: true, indexed: true }
  seconds_taken: { type: int64, required: true }
  seconds_data_lost: { type: int64, required: true }
  passed: { type: bool, default: false }
  notes: { type: text, max_length: 5000 }
  custodian_id: { type: uuid, required: true, indexed: true }
relations:
  dataset: { kind: belongs_to, entity: dataset, field: dataset_id }
admin:
  label: Recovery drills
  list_columns: [dataset_id, ran_at, seconds_taken, seconds_data_lost, passed]
