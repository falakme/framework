schema_version: 1
entity: dataset
owner: custodian_id
fields:
  name: { type: text, required: true, max_length: 120, unique: true }
  description: { type: text, max_length: 2000 }
  classification: { type: text, required: true, max_length: 20, default: internal, indexed: true }
  contains_pii: { type: bool, default: false }
  retention_days: { type: int64, required: true, default: 365 }
  rpo_minutes: { type: int64, required: true, default: 5 }
  rto_minutes: { type: int64, required: true, default: 60 }
  custodian_id: { type: uuid, required: true, indexed: true }
admin:
  label: Datasets
  list_columns: [name, classification, rpo_minutes, rto_minutes]
  search_fields: [name]
lifecycle:
  soft_delete: true
