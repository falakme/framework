schema_version: 1
entity: backup_run
owner: custodian_id
fields:
  dataset_id: { type: uuid, required: true, indexed: true, references: dataset.id }
  taken_at: { type: timestamptz, required: true, indexed: true }
  kind: { type: text, required: true, max_length: 20, default: base }
  size_bytes: { type: int64, required: true, default: 0 }
  location: { type: text, max_length: 500 }
  verified: { type: bool, default: false }
  custodian_id: { type: uuid, required: true, indexed: true }
relations:
  dataset: { kind: belongs_to, entity: dataset, field: dataset_id }
admin:
  label: Backups
  list_columns: [dataset_id, taken_at, kind, verified]
